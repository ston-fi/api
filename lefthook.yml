# Lefthook configuration guide: https://lefthook.dev/configuration

pre-commit:
  parallel: true
  commands:
    format:oxfmt:
      # https://oxc.rs/docs/guide/usage/formatter/integration.html#pre-commit-hook
      run: npx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
